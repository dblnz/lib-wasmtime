[package]
name = "ukwasmtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ukrust = { path = "../../unikraft/lib/ukrust/" }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dependencies.wasmtime]
version = "45.0.0"
default-features = false
features = [
    "runtime",
    "component-model",
    "custom-virtual-memory",
    "custom-native-signals",
    "custom-sync-primitives",
]
